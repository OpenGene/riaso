name: riaso ci

on:
  push:
    branches: [main]
    paths:
      - "RIASO/riaso/**"
      - ".github/workflows/riaso.yml"
  pull_request:
    branches: [main]
    paths:
      - "RIASO/riaso/**"
      - ".github/workflows/riaso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  build:
    name: dist
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: cargo fmt --check
        working-directory: RIASO/riaso
        run: cargo fmt --all -- --check

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "RIASO/riaso -> target"

      - name: conda environment (hdf5 1.14.6, arpack, fontconfig, dejavu)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          environment-file: RIASO/riaso/environment-linux.yml
          activate-environment: riaso
          auto-activate-base: false

      - name: expose conda's HDF5 to pkg-config
        run: |
          set -euo pipefail
          prefix="$(conda info --base)/envs/riaso"
          mkdir -p "$prefix/lib/pkgconfig"
          if [ ! -f "$prefix/lib/pkgconfig/hdf5.pc" ]; then
            printf '%s\n' \
              "prefix=$prefix" \
              'exec_prefix=${prefix}' \
              'libdir=${exec_prefix}/lib' \
              'includedir=${prefix}/include' \
              'Name: hdf5' \
              'Description: HDF5 (without high-level)' \
              'Version: 1.14.6' \
              'Requires:' \
              'Libs: -L${libdir} -lhdf5' \
              'Cflags: -I${includedir}' \
              > "$prefix/lib/pkgconfig/hdf5.pc"
          fi
          {
            echo "HDF5_DIR=$prefix"
            echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig"
          } >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          pkg-config --exists hdf5 && pkg-config --modversion hdf5

      - name: cargo clippy
        working-directory: RIASO/riaso
        run: |
          cargo clippy --all-targets --locked -- \
            -D warnings \
            -A clippy::type_complexity \
            -A clippy::too_many_arguments \
            -A clippy::derivable_impls

      - name: build the self-contained distribution
        working-directory: RIASO/riaso
        run: bash scripts/build_binary.sh

      - name: show the packaged version
        working-directory: RIASO/riaso
        run: ./dist/riaso -V

      - name: upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: riaso-${{ runner.os }}-${{ runner.arch }}
          path: RIASO/riaso/dist
