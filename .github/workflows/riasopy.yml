name: riasopy ci

on:
  push:
    branches: [main]
    paths:
      - "RIASO/riasopy/**"
      - ".github/workflows/riasopy.yml"
  pull_request:
    branches: [main]
    paths:
      - "RIASO/riasopy/**"
      - ".github/workflows/riasopy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  build:
    name: wheel
    runs-on: ubuntu-22.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash {0}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: cargo fmt --check
        working-directory: RIASO/riasopy
        run: cargo fmt --all -- --check

      - uses: Swatinem/rust-cache@v2
        with:
          key: manylinux-2-28-native
          workspaces: "RIASO/riasopy -> target"

      - name: conda build dependencies (hdf5 1.14.6, arpack, maturin, fonts)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          environment-file: RIASO/riasopy/environment-linux.yml
          activate-environment: riasopy-build
          auto-activate-base: false

      - name: expose conda's HDF5 to pkg-config
        run: |
          set -euo pipefail
          prefix="$(conda info --base)/envs/riasopy-build"
          mkdir -p "$prefix/lib/pkgconfig"
          if [ ! -f "$prefix/lib/pkgconfig/hdf5.pc" ]; then
            printf '%s\n' \
              "prefix=$prefix" \
              'exec_prefix=${prefix}' \
              'libdir=${exec_prefix}/lib' \
              'includedir=${prefix}/include' \
              'Name: hdf5' \
              'Description: HDF5 (without high-level)' \
              'Version: 1.14.6' \
              'Requires:' \
              'Libs: -L${libdir} -lhdf5' \
              'Cflags: -I${includedir}' \
              > "$prefix/lib/pkgconfig/hdf5.pc"
          fi
          {
            echo "HDF5_DIR=$prefix"
            echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig"
            echo "PYO3_PYTHON=$prefix/bin/python"
          } >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          pkg-config --exists hdf5 && pkg-config --modversion hdf5

      - name: cargo clippy
        working-directory: RIASO/riasopy
        run: |
          cargo clippy --all-targets --features python --locked -- \
            -D warnings \
            -A clippy::type_complexity \
            -A clippy::too_many_arguments \
            -A clippy::derivable_impls \
            -A clippy::iter_cloned_collect \
            -A clippy::manual_div_ceil

      - name: build the wheel
        working-directory: RIASO/riasopy
        run: bash scripts/build_wheel.sh

      - name: install and import on glibc 2.28
        working-directory: RIASO/riasopy
        run: |
          set -euo pipefail
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          /opt/python/cp311-cp311/bin/python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/python -m pip install --only-binary=:all: target/wheels/riasopy-*manylinux_2_28_x86_64*.whl
          /tmp/wheel-test/bin/python -m pip check
          env -u LD_LIBRARY_PATH -u FONTCONFIG_FILE -u FONTCONFIG_PATH \
            /tmp/wheel-test/bin/python -I -c "import riasopy, numpy; print('riasopy', riasopy.__version__, 'numpy', numpy.__version__)"

      - name: upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: riasopy-wheel-${{ runner.os }}-${{ runner.arch }}
          path: RIASO/riasopy/target/wheels/riasopy-*manylinux_2_28_x86_64*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install maturin
        run: python -m pip install "maturin>=1.5,<2"

      - name: build sdist
        working-directory: RIASO/riasopy
        run: maturin sdist

      - name: upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: riasopy-sdist
          path: RIASO/riasopy/target/wheels/riasopy-*.tar.gz
