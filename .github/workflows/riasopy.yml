name: riasopy ci

on:
  push:
    branches: [main]
    paths:
      - "RIASO/riasopy/**"
      - ".github/workflows/riasopy.yml"
  pull_request:
    branches: [main]
    paths:
      - "RIASO/riasopy/**"
      - ".github/workflows/riasopy.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  build:
    name: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: cargo fmt --check
        working-directory: RIASO/riasopy
        run: cargo fmt --all -- --check

      - uses: Swatinem/rust-cache@v2
        with:
          key: conda-explicit-linker-sysroot217
          workspaces: "RIASO/riasopy -> target"

      - name: conda environment (hdf5 1.14.6, arpack, maturin, sysroot 2.17)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          environment-file: RIASO/riasopy/environment-linux.yml
          activate-environment: riasopy-build
          auto-activate-base: false

      - name: expose conda's HDF5 to pkg-config
        run: |
          set -euo pipefail
          prefix="$(conda info --base)/envs/riasopy-build"
          mkdir -p "$prefix/lib/pkgconfig"
          if [ ! -f "$prefix/lib/pkgconfig/hdf5.pc" ]; then
            printf '%s\n' \
              "prefix=$prefix" \
              'exec_prefix=${prefix}' \
              'libdir=${exec_prefix}/lib' \
              'includedir=${prefix}/include' \
              'Name: hdf5' \
              'Description: HDF5 (without high-level)' \
              'Version: 1.14.6' \
              'Requires:' \
              'Libs: -L${libdir} -lhdf5' \
              'Cflags: -I${includedir}' \
              > "$prefix/lib/pkgconfig/hdf5.pc"
          fi
          {
            echo "HDF5_DIR=$prefix"
            echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig"
            echo "PYO3_PYTHON=$prefix/bin/python"
          } >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          pkg-config --exists hdf5 && pkg-config --modversion hdf5

      - name: cargo clippy
        working-directory: RIASO/riasopy
        run: |
          cargo clippy --all-targets --features python --locked -- \
            -D warnings \
            -A clippy::type_complexity \
            -A clippy::too_many_arguments \
            -A clippy::derivable_impls \
            -A clippy::iter_cloned_collect \
            -A clippy::manual_div_ceil

      - name: build the wheel
        working-directory: RIASO/riasopy
        run: bash scripts/build_wheel.sh

      - name: show the packaged version
        working-directory: RIASO/riasopy
        run: |
          set -euo pipefail
          whl=$(ls -t target/wheels/riasopy-*.whl | sed -n 1p)
          echo "$whl"
          conda create -y -n wheel-test -c conda-forge python=3.11 numpy=2.4.6
          conda run -n wheel-test --no-capture-output python -m pip install --no-deps "$PWD/$whl"
          conda run -n wheel-test --no-capture-output python -I -c "import riasopy; print('riasopy', riasopy.__version__)"

      - name: upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: riasopy-wheel-${{ runner.os }}-${{ runner.arch }}
          path: RIASO/riasopy/target/wheels/riasopy-*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install maturin
        run: python -m pip install "maturin==1.14.1"

      - name: build sdist
        working-directory: RIASO/riasopy
        run: maturin sdist --out dist

      - name: upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: riasopy-sdist
          path: RIASO/riasopy/dist/riasopy-*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/riasopy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: riasopy-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import email
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          tag = os.environ["RELEASE_TAG"]
          expected = tag.removeprefix("v")
          wheels = list(Path("dist").glob("riasopy-*.whl"))
          sources = list(Path("dist").glob("riasopy-*.tar.gz"))
          if not wheels or len(sources) != 1:
              raise SystemExit("Expected built wheels and exactly one source distribution")
          for artifact in wheels + sources:
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      entries = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
                      if len(entries) != 1:
                          raise SystemExit(f"Invalid wheel metadata: {artifact}")
                      raw = archive.read(entries[0])
              else:
                  with tarfile.open(artifact) as archive:
                      entries = [m for m in archive.getmembers()
                                 if m.name.count("/") == 1 and m.name.endswith("/PKG-INFO")]
                      if len(entries) != 1:
                          raise SystemExit(f"Invalid source metadata: {artifact}")
                      raw = archive.extractfile(entries[0]).read()
              metadata = email.message_from_bytes(raw)
              if metadata["Name"] != "riasopy" or metadata["Version"] != expected:
                  raise SystemExit(f"{artifact}: package name/version does not match release {tag}")
              print(f"Verified {artifact.name}: {metadata['Version']}")
          PY

      - name: publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
