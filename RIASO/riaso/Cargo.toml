[package]
name = "riaso"
version = "0.0.1"
edition = "2021"
rust-version = "1.93"
description = "Spatial omics data analysis framework"
license = "MIT"

[lib]
name = "riaso"
crate-type = ["cdylib", "rlib"]

# Pure-Rust binary delivery: the `riaso` CLI drives the whole pipeline (see src/main.rs / src/config.rs).
[[bin]]
name = "riaso"
path = "src/main.rs"

[dependencies]
# Every version is pinned exactly (`=x.y.z`), one-to-one with Cargo.lock; all are stable crates.io releases.
# Toolchain pinned to rustc/cargo 1.95.0 (rust-version 1.93 is the lowest real MSRV among the dependencies).
# To upgrade a dependency: bump the version here by hand and run `cargo update -p <crate>`, keeping builds reproducible.
ndarray = "=0.17.2"
nalgebra = "=0.34.2"
nalgebra-sparse = "=0.11.0"
polars = { version = "=0.45.1", features = ["lazy", "csv"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
anyhow = "=1.0.103"
hdf5 = { package = "hdf5-metno", version = "=0.12.6", features = ["blosc", "blosc-zstd"] }
arpack = "=0.0.2"
arpack-sys = "=0.0.2"
rayon = "=1.12.0"
# GEM text files are distributed gzipped; default Rust backend (miniz_oxide), no system zlib dependency
flate2 = "=1.1.9"
leiden-rs = { version = "=0.8.1", default-features = false, features = ["rayon"] }
plotters = "=0.3.7"
tempfile = "=3.27.0"
# Reads GO annotation databases (AnnotationDbi sqlite); `bundled` ships its own SQLite engine, no system library needed
rusqlite = { version = "=0.32.1", features = ["bundled"] }
# CLI argument parsing (derive); used only by [[bin]], the library does not depend on it
clap = { version = "=4.6.7", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
